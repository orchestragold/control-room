<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Room</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap { text-align: center; padding: 2rem; }
    h1 {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 0.4rem;
    }
    .user { color: #444; font-size: 0.8rem; margin-bottom: 1.75rem; }
    .mode {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 2px;
      margin-bottom: 2rem;
      {% if mode == 'live' %}
      background: #052e16; color: #4ade80;
      {% else %}
      background: #1c0a0a; color: #f87171;
      {% endif %}
    }
    .logout { color: #333; font-size: 0.75rem; text-decoration: none; }
    .logout:hover { color: #666; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Control Room</h1>
    <p class="user">{{ current_user.email }}</p>
    <div class="mode">{{ mode }} mode</div>
    <br>
    <a href="{{ url_for('auth.logout') }}" class="logout">sign out</a>
  </div>
</body>
</html>
